<!DOCTYPE html>

<script>
/* ============================================================
   ★ امنیت: گیت احراز هویت (سمت کلاینت)
   هیچ صفحه‌ای بدون ورود به سامانه باز نمی‌شود. محتوای صفحه
   مخفی می‌ماند و کاربر به صفحه ورود هدایت می‌شود.
   (لایه نمایشی؛ لایه امنیتی واقعی در بکاند اعمال می‌شود.)
   ============================================================ */
(function(){
  var ok = false;
  try {
    var _u = JSON.parse(localStorage.getItem('hse_user_activated') || 'null');
    ok = !!(_u && _u.personnel && _u.fullname);
  } catch(e) { ok = false; }
  if (ok) return; // مجاز - ادامه می‌دهد

  // پنهان‌کردن کل محتوا و نمایش قفل
  var hide = function(){
    try {
      var d = document;
      // مخفی کردن همه عناصر
      var all = d.body ? d.body.children : [];
      for (var i=0;i<all.length;i++){ all[i].style.display='none'; }
      var lock = d.createElement('div');
      lock.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#0f172a;color:#f8fafc;'
        +'display:flex;flex-direction:column;align-items:center;justify-content:center;'
        +'font-family:Tahoma,sans-serif;text-align:center;padding:20px;direction:rtl;';
      lock.innerHTML = '<div style="font-size:60px;margin-bottom:10px;">🔒</div>'
        +'<h2 style="margin:0 0 8px;">دسترسی محدود است</h2>'
        +'<p style="margin:0 0 20px;color:#94a3b8;">لطفاً ابتدا از صفحه اصلی وارد سامانه شوید.</p>'
        +'<a href="index.html" style="background:#ff6208;color:#fff;padding:10px 26px;'
        +'border-radius:10px;text-decoration:none;font-weight:bold;">بازگشت به صفحه ورود</a>';
      d.body.appendChild(lock);
    } catch(e){}
  };
  if (document.body) hide(); else document.addEventListener('DOMContentLoaded', hide);
  setTimeout(function(){ try{ location.replace('index.html'); }catch(e){} }, 2500);
})();
</script>
