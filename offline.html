<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1e3c5c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HSE درکاو" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <title>عدم دسترسی به اینترنت | سامانه ایمنی درکاو</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: linear-gradient(145deg, #eef2f7 0%, #dfe7f0 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; color: #1e2a2e; text-align: center;
        }
        .box {
            max-width: 420px; width: 100%;
            background: rgba(255,255,255,0.98);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .head { background: #1e3c5c; padding: 30px 20px; color: #fff; border-bottom: 4px solid #ff6208; }
        .head .emoji { font-size: 3rem; display: block; margin-bottom: 8px; }
        .content { padding: 28px 22px; }
        .content p { color: #64748b; font-size: 0.95rem; line-height: 1.9; margin-bottom: 20px; }
        button {
            background: #ff6208; color: #fff; border: none; padding: 14px 28px;
            border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; width: 100%;
        }
        button:hover { background: #e05300; }
    </style>
</head>
<body>
    <div class="box">
        <div class="head">
            <span class="emoji">📶</span>
            <h1 style="font-size:1.2rem;">اتصال به اینترنت برقرار نیست</h1>
        </div>
        <div class="content">
            <p>برای اولین بار باز کردن سامانه به اتصال اینترنت نیاز است. لطفاً اتصال خود را بررسی کرده و دوباره تلاش کنید.</p>
            <button onclick="location.reload()">🔄 تلاش مجدد</button>
        </div>
    </div>
<script src="assets/js/sw-register.js"></script>
</body>
</html>
